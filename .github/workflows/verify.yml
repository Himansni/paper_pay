# BEGINNER NOTE:
# [Continuous Integration Verification Pipeline]
# This GitHub Actions workflow runs on every pull request and commit to main.
# It enforces automated quality gates before any code can be merged:
# 1. Formatting & static analysis (no lint errors, zero warnings)
# 2. Complete Flutter test suite execution
# 3. Cloud Firestore Security Rules unit tests against the local emulator
# 4. Composite index alignment with firestore.indexes.json
# 5. Release configuration and project isolation validation
# 6. Repository hygiene checks (ensuring no secrets, credentials, or keys are committed)
# 7. End-to-end integration tests using emulators
# 8. Unsigned development APK compilation smoke test
name: Verify PaperRoute

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - run: npm run test:rules
      - run: npm run validate:indexes
      - run: npm run validate:release
      - run: npm run validate:hygiene
      - run: git diff --check
      - name: Run emulator integration smoke tests
        run: xvfb-run --auto-servernum npm run test:integration
      - name: Build unsigned development release APK
        run: flutter build apk --release --flavor development --dart-define=APP_ENV=development
